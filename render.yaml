# Render Blueprint — avalonpediatw 後端 (Edward 2026-06-25 改回 Render Free)
#
# 用途：Render Dashboard →「New +」→「Blueprint」→ 連這個 repo，Render 會讀
# 本檔自動建立服務。後端就是 Express + Socket.IO，聽 $PORT、有 /health、無狀態，
# 不需改任何伺服器程式碼。
#
# Free 方案注意：閒置 15 分鐘會休眠、清空記憶體；冷清後第一個請求要等 30~60 秒
# 冷啟動。只要有人開著分頁（Socket.IO 心跳），進行中的對局通常不會被打斷。
#
# 機密類 envVar 設 `sync: false` → 不寫進 repo，請到 Dashboard 的 Environment 填。
services:
  - type: web
    name: avalon-server
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    region: singapore        # 離台灣最近的 Render 節點
    plan: free
    branch: main
    autoDeploy: true         # push 到 main 自動部署（不需 webhook / GitHub Action）
    healthCheckPath: /health
    # 只有後端用得到的檔案變動才重新部署（20261009）。每次部署都會重開 server：
    # 進行中的對局、大廳聊天、LINE 待送佇列都在記憶體裡，會一起消失。戰績歸檔
    # 每打完一局就 commit 一次 avalon-game-records/** 到 main，沒有這個過濾的話，
    # 正式機會每局重開一次。server 執行期只讀 packages/server 與 packages/shared。
    buildFilter:
      paths:
        - packages/server/**
        - packages/shared/**
        - Dockerfile.server
        - .dockerignore
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - tsconfig.json
        - turbo.json
      ignoredPaths:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.md"

    envVars:
      - key: NODE_ENV
        value: production

      # PORT 由 Render 自動注入，server 讀 process.env.PORT — 不要在這寫死。

      # CORS：玩家前端在 Firebase Hosting。多網域用逗號分隔，server 會自動切陣列。
      - key: CORS_ORIGIN
        value: https://avalon-game-platform.web.app,https://avalon-game-platform.firebaseapp.com,https://avalonpediatw.pages.dev

      # ── 必填機密（到 Dashboard 填；缺 JWT_SECRET server 會拒絕啟動！）──────
      - key: JWT_SECRET            # openssl rand -hex 32
        sync: false
      - key: ADMIN_SECRET
        sync: false

      # ── GitHub 帳號庫（email/密碼登入；GitHub-only 架構核心）──────────────
      # 務必用 PRIVATE repo（內含密碼雜湊）。Token 缺 → 登入回 no_store。
      - key: GITHUB_ACCOUNTS_TOKEN
        sync: false
      - key: GITHUB_ACCOUNTS_REPO
        value: l12203685/avalonpediatw-accounts   # PRIVATE repo
      - key: GITHUB_ACCOUNTS_BRANCH
        value: main

      # ── GitHub 完賽歸檔（戰績；public repo 可）────────────────────────────
      # 2026-07-08：avalon-game-records 已併入本 monorepo（avalon-game-records/
      # 目錄），改寫回本 repo；GITHUB_RECORDS_TOKEN 需重新核發／擴權到這個 repo
      # （l12203685/avalonpediatw）的 Contents: Read and write，舊 token 若只
      # 綁定 avalon-game-records 這個獨立 repo 會失效。
      - key: GITHUB_RECORDS_TOKEN
        sync: false
      - key: GITHUB_RECORDS_REPO
        value: l12203685/avalonpediatw
      - key: GITHUB_RECORDS_BRANCH
        value: main

      # ── LINE / Discord 三向同步（#82；2026-10-08 修回）────────────────────
      # 2026-06-25 重建這份藍圖時沒帶這一段，正式機上 LINE / Discord bot 與
      # ChatMirror 全部在開機時被跳過 —— 這就是「同步又壞了」的直接原因。
      # 全部到 Dashboard 填；缺哪個就少哪條腿，不會讓 server 起不來。
      # 操作與驗證方式：docs/LINE_DISCORD_SYNC.md
      - key: DISCORD_BOT_TOKEN                 # Discord Developer Portal → 阿瓦隆 bot → Bot → Token
        sync: false
      - key: DISCORD_CLIENT_ID                 # 阿瓦隆 bot 的 Application ID（公開值，非機密）
        value: "1138799027664732180"
      - key: LINE_BOT_CHANNEL_ACCESS_TOKEN     # LINE Console → Messaging API → long-lived token
        sync: false
      - key: LINE_BOT_CHANNEL_SECRET           # LINE Console → Basic settings → Channel secret
        sync: false
      - key: LOBBY_MIRROR_LINE_GROUP_ID        # 阿瓦隆百科 LINE 群 groupId（C 開頭）；不知道就先空著，
        sync: false                            # 在群裡講一句話，Render → Logs 會印出 "[LINE] event from group C…"
      - key: LOBBY_MIRROR_DISCORD_CHANNEL_ID   # 阿瓦隆百科 LINE↔Discord 同步頻道（公開值，非機密）
        value: "1132901301802504242"
      # LINE webhook URL 由 code 持有：啟動時自動 PUT 到 LINE（用 Render 注入的
      # RENDER_EXTERNAL_URL + /webhook/line），每 6 小時重查。同一個 LINE channel
      # 只能有一個 webhook → 只允許「一個」部署開 autoset；若地端也在跑，請在
      # 其中一邊設 false。
      - key: LINE_WEBHOOK_AUTOSET
        value: "true"
      # 出站 LINE 走 reply_token 排隊（免費）；false = 逐則 push（吃每月免費額度）。
      - key: LINE_REPLY_DRAIN
        value: "true"
      # 圖片同步（2026-10-13）不需要新變數：Discord → LINE 的圖從 RENDER_EXTERNAL_URL/media/relay/… 提供。
      #   CHAT_MIRROR_IMAGES   預設開；false = 兩個方向的圖都改送文字說明、不下載（需要時才在 Dashboard 加）
      # bot 產生的加入連結 / Discord 邀請要指回玩家前端。
      - key: WEB_BASE_URL
        value: https://avalon-game-platform.web.app
      # Free 方案閒置 15 分鐘會休眠：Discord 斷線、記憶體清空。server 每 10 分鐘打一次
      # 自己的公開網址保持常駐（免費；單一服務全月常駐 ≤ 744 小時 < 免費額度 750）。
      - key: KEEP_ALIVE
        value: "true"

      # ── 每日聊天紀錄匯出（2026-10-13；docs/COMMUNITY_FEEDBACK.md）──────────
      # 每天 04:30（+08）起 bot 把前一天公開頻道、公開論壇貼文與 LINE↔Discord 同步頻道的聊天
      # （發言者換成 成員N，每天重新編號）寫進阿瓦隆百科試算表的「聊天紀錄」分頁，只留最近 7 天；重啟後自動補齊 7 天。
      # 同樣的列也寫一份「閱讀副本」到私人那份試算表（「聊天紀錄」固定第一個分頁），只為了讓 AI 管理員用 Drive 下載 CSV 讀得到；不用設變數。
      # 那份試算表知道連結的人都能看——Edward 2026-10-13 決定（「照搬」），不用設任何變數。
      # 免費：只用 Discord 與 Google Sheets API，沒有付費 API、不燒 token。log 只印數字。
      # 只讀阿瓦隆百科這一個 Discord 伺服器（DISCORD_GUILD_ID 沒設時），bot 被加進別的伺服器也不讀。
      # 舊名 COMMUNITY_DIGEST_SHEET_ID 不要再設：它會蓋過阿瓦隆百科這個預設（Render ops → apply 會刪掉它）。
      # 機密由 Actions → Render ops → apply 從 GitHub secrets 複製，不必手填。
      - key: GOOGLE_SERVICE_ACCOUNT_JSON       # ← GitHub secret AVALON_STATS_SHEETS_CREDENTIALS_JSON（或 GOOGLE_SHEETS_CREDENTIALS_JSON）
        sync: false                            #   服務帳號 JSON；沒有就不匯出
      # 以下都不是機密、預設就能用，需要時才在 Dashboard 加：
      #   CHAT_EXPORT_ENABLED                 預設開；false 關閉
      #   CHAT_EXPORT_SHEET_ID                預設阿瓦隆百科試算表；填私人那份的 id 就改寫那份；off 關閉（閱讀副本也一起停）
      #   CHAT_EXPORT_ALLOW_PUBLIC_SHEET      不設（或 1/true/yes/on）= 照寫；其他任何值（0、no、中文「是」…）= 拒絕寫入、不匯出，只刪 7 天以前的列（不影響閱讀副本）
      #   CHAT_EXPORT_READING_COPY_SHEET_ID   閱讀副本那份；預設私人那份（練習回報分頁不動）；off 關閉；等於主匯出那份、公開戰績試算表或主匯出 off 時自動停用
      #   CHAT_EXPORT_EXTRA_SOURCE_IDS        另外加讀這些頻道或論壇（逗號分隔；預設名單照讀）
      #   CHAT_EXPORT_SOURCE_CHANNEL_IDS      只讀這些頻道或論壇（取代預設名單；逗號分隔；同步頻道一定會讀）
      #   CHAT_EXPORT_EXCLUDE_CHANNEL_IDS     不讀這些頻道、論壇或貼文（逗號分隔；「大劍管理員」與 /意見 頻道一定不讀）
      #   FEEDBACK_DISCORD_CHANNEL_ID         /意見 轉貼頻道 id；預設管理員頻道「大劍管理員」；off 不轉貼（練習回報的 Discord 副本也貼這裡）
      #   PRACTICE_REPORT_DISCORD             練習模式「這步怪怪的」回報寫進試算表後，另貼一則到上面那個管理員頻道（2026-10-14）；預設開；false 只關 Discord 這份

      # ── Firebase / Supabase：GitHub-only 架構「不需要」，全部留空即可 ──────
      # 留空 → server 進 guest-only 模式、由上面 GitHub 帳號庫接管登入。僅在
      # 日後想恢復排行榜 / 個人資料編輯等 Firestore 功能時才需要回填。
