name: Import Discord records

# 每天把 Discord 論壇 #牌譜紀錄與覆盤（每篇貼文一局）的牌譜匯入 Google 試算表的「Discord匯入」分頁，
# 30 分鐘後 refresh-analysis-cache.yml 會把 牌譜 + Discord匯入 一起算進戰績分析快取。
#
# Discord 訊息只會發兩種：格式回覆（reply，在討論串）與手動才發的牌譜修正清單（fix_list，在「牌譜修正」頻道），見下。
# 試算表只會在「Discord匯入」分頁往下追加列（沒有就建立；有貼回覆時另在「Discord回覆」
# 分頁記下每則已貼的回覆），不動「牌譜」或其他分頁。以 discord_post_id 為鍵，可重跑；已在 牌譜 的局（指紋相同、
# 或同配置同任務結果同玩家）與標「已收錄」的貼文不匯入；無法完整、無歧義解析的貼文略過並統計原因。
# 說明文件：docs/DISCORD_RECORDS_IMPORT.md。
#
# 格式回覆（reply，預設開；Edward 2026-10-13 決定）：對 14 天內因格式無法解析（非已收錄／模擬／重複／
#   起始訊息刪除或空白／沒有牌譜也沒有結果標籤或配置的討論貼文）且尚未回覆過的貼文，在該討論串貼一則
#   「🤖 牌譜格式檢查」：第幾行、原因、格式提示；不 @ 任何人；每次最多 20 則；bot 沒有發言權限時只警告不中斷。
#   每篇只回一次：已貼的回覆記在「Discord回覆」分頁，回覆被刪也不再貼；送出遇伺服器錯誤或逾時不重送
#   （可能已貼出，下次先查）。論壇缺少已收錄／模擬／結果標籤（改名？）時不回覆、只警告。
#   dry run（沒有寫入）只計數不貼。預設回覆；repo variable DISCORD_IMPORT_REPLY 設為 'false' 可關（排程與手動
#   執行都不回）；手動執行另看 reply 勾選（預設勾）。
#
# 牌譜修正清單（fix_list）：Edward 2026-10-13 決定不需要每週清單（「應該不用牌譜修正了」）——要修的貼文都有
#   機器人的「🤖 牌譜格式檢查」回覆，用 Discord 搜尋 from:機器人 in:#牌譜紀錄與覆盤 就找得到（docs/DISCORD_RECORDS_IMPORT.md）。所以排程**不再**
#   帶 --fix-list；只有手動執行勾 fix_list（預設不勾）時才發：把最近 30 天發文、需要回覆的那些貼文依牌譜日期
#   列成清單發到 Discord 文字頻道「牌譜修正」（repo variable DISCORD_FIX_CHANNEL_ID 有設就用那個頻道），
#   每週最多一次。找不到頻道或沒有權限時只留 notice。dry run 只計數不發。repo variable DISCORD_FIX_LIST 設為
#   'false' 時手動勾了也不發。
#
# 寫入與否：手動執行看 write 勾選（預設不寫，只做 dry run）；排程執行預設寫入
#   （2026-10-12 首次寫入 82 局驗證無誤後開啟），repo variable DISCORD_IMPORT_WRITE 設為 'false' 可暫停
#   （只影響排程執行）。
# 金鑰：DISCORD_BOT_TOKEN（bot 需能看論壇與讀訊息歷史；回覆另需在討論串發言的權限）；試算表金鑰同 refresh-analysis-cache.yml
#   （AVALON_STATS_SHEETS_CREDENTIALS_JSON，沒有就用 GOOGLE_SHEETS_CREDENTIALS_JSON）。
#   寫入需要服務帳號對試算表有「編輯者」權限（dry run 檢視者即可）。
# 公開 repo：log 與 job summary 只有數量與固定的原因字串，不含玩家名字、牌譜內容、貼文標題或連結。
#   不要在這裡加 --report（含標題，只給本機用；CI 中會被拒絕）。

on:
  schedule:
    - cron: '17 19 * * *'   # 每天 03:17 台灣時間，早於 refresh-analysis-cache 的 03:47
  workflow_dispatch:
    inputs:
      write:
        description: '寫入試算表的「Discord匯入」分頁（不勾 = dry run：只解析、去重、印數量）'
        type: boolean
        default: false
      limit:
        description: '最多寫入幾局（空白 = 不限；例如第一次先寫 5 局檢查）'
        required: false
        default: ''
      reply:
        description: '在 14 天內因格式無法解析的貼文討論串回覆原因與格式提示（不勾 write 時只計數不貼；repo variable DISCORD_IMPORT_REPLY 為 false 時不回）'
        type: boolean
        default: true
      fix_list:
        description: '（只有手動）在「牌譜修正」頻道發本週的牌譜修正清單（本週發過就略過；不勾 write 時只計數不發；repo variable DISCORD_FIX_LIST 為 false 時不發）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-discord-records
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  import:
    name: Import new Discord forum records into Discord匯入
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check the secrets
        id: creds
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          secret=""
          if [ -n "${PRIMARY_JSON}" ]; then
            secret="AVALON_STATS_SHEETS_CREDENTIALS_JSON"
          elif [ -n "${FALLBACK_JSON}" ]; then
            secret="GOOGLE_SHEETS_CREDENTIALS_JSON"
          fi
          missing=""
          if [ -z "${secret}" ]; then
            missing="AVALON_STATS_SHEETS_CREDENTIALS_JSON (or GOOGLE_SHEETS_CREDENTIALS_JSON)"
          fi
          if [ -z "${DISCORD_BOT_TOKEN}" ]; then
            missing="${missing:+${missing} and }DISCORD_BOT_TOKEN"
          fi
          if [ -n "${missing}" ]; then
            msg="Skipped, nothing read or written: add the repository secret(s) ${missing}."
            echo "::notice title=Discord import skipped::${msg}"
            { echo "### Discord 牌譜匯入：略過（未設定金鑰）"; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"
            secret=""
          fi
          echo "secret=${secret}" >> "$GITHUB_OUTPUT"

      - name: Decide dry run or write
        id: mode
        if: steps.creds.outputs.secret != ''
        env:
          EVENT: ${{ github.event_name }}
          INPUT_WRITE: ${{ inputs.write }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_REPLY: ${{ inputs.reply }}
          INPUT_FIX_LIST: ${{ inputs.fix_list }}
          VAR_WRITE: ${{ vars.DISCORD_IMPORT_WRITE }}
          VAR_REPLY: ${{ vars.DISCORD_IMPORT_REPLY }}
          VAR_FIX_LIST: ${{ vars.DISCORD_FIX_LIST }}
        run: |
          write=false
          reply=false
          fix_list=false
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            if [ "${INPUT_WRITE}" = "true" ]; then
              write=true
            fi
            if [ "${INPUT_REPLY}" = "true" ]; then
              reply=true
            fi
            if [ "${INPUT_FIX_LIST}" = "true" ]; then
              fix_list=true
            fi
          else
            if [ "${VAR_WRITE}" != "false" ]; then
              write=true
            fi
            reply=true
            # No weekly fix list on schedule any more (owner 2026-10-13): the posts to fix are found by
            # searching Discord for the bot's replies. fix_list stays a manual-only option.
          fi
          # The repo variables switch these off for every run, the manual reply box being ticked by default.
          reply_note=""
          fix_list_note=""
          if [ "${VAR_REPLY}" = "false" ]; then
            reply=false
            reply_note=" (repository variable DISCORD_IMPORT_REPLY is 'false')"
          fi
          if [ "${VAR_FIX_LIST}" = "false" ]; then
            fix_list=false
            fix_list_note=" (repository variable DISCORD_FIX_LIST is 'false')"
          fi
          limit="$(printf '%s' "${INPUT_LIMIT}" | tr -d '[:space:]')"
          if [ -n "${limit}" ] && ! printf '%s' "${limit}" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Bad limit input::limit must be a whole number or blank."
            exit 1
          fi
          echo "write=${write}" >> "$GITHUB_OUTPUT"
          echo "limit=${limit}" >> "$GITHUB_OUTPUT"
          echo "reply=${reply}" >> "$GITHUB_OUTPUT"
          echo "fix_list=${fix_list}" >> "$GITHUB_OUTPUT"
          if [ "${write}" = "true" ]; then
            echo "Mode: write (append new games to Discord匯入)${limit:+, at most ${limit}}"
          else
            echo "Mode: dry run (nothing is written)"
          fi
          if [ "${reply}" = "true" ]; then
            echo "Reply: on (format replies in Discord threads; counted only in a dry run)"
          else
            echo "Reply: off${reply_note}"
          fi
          if [ "${fix_list}" = "true" ]; then
            echo "Fix list: on (manual run: list in the 牌譜修正 channel; counted only in a dry run)"
          else
            echo "Fix list: off${fix_list_note}"
          fi

      - name: Checkout
        if: steps.creds.outputs.secret != ''
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.creds.outputs.secret != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/server/requirements-stats.txt

      - name: Install pinned dependencies
        if: steps.creds.outputs.secret != ''
        run: python -m pip install --disable-pip-version-check -r packages/server/requirements-stats.txt

      - name: Offline unit tests of the importer
        if: steps.creds.outputs.secret != ''
        run: python packages/server/test_discord_records_import.py

      - name: Write the service-account key to a temp file
        if: steps.creds.outputs.secret != ''
        env:
          SECRET_NAME: ${{ steps.creds.outputs.secret }}
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP}/avalon-import-sa.XXXXXX")"
          echo "AVALON_STATS_CREDENTIALS_FILE=${key_file}" >> "$GITHUB_ENV"
          if [ "${SECRET_NAME}" = "AVALON_STATS_SHEETS_CREDENTIALS_JSON" ]; then
            printf '%s' "${PRIMARY_JSON}" > "${key_file}"
          else
            printf '%s' "${FALLBACK_JSON}" > "${key_file}"
          fi
          # Validate the shape and print only client_email (not secret) -- never the key itself.
          python - "${key_file}" "${SECRET_NAME}" <<'PY'
          import json, sys
          path, secret = sys.argv[1], sys.argv[2]
          try:
              with open(path, encoding="utf-8-sig") as f:
                  info = json.load(f)
          except ValueError:
              info = None
          if not isinstance(info, dict) or not info.get("client_email") or not info.get("private_key"):
              print(f"::error title=Credentials secret malformed::Secret {secret} is not a Google "
                    "service-account JSON key (needs client_email and private_key). Paste the whole "
                    "downloaded key file content.")
              sys.exit(1)
          print(f"Using service account {info['client_email']} (from secret {secret}).")
          PY

      - name: Import (dry run unless write is on)
        if: steps.creds.outputs.secret != ''
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          AVALON_STATS_SHEET_ID: ${{ vars.AVALON_STATS_SHEET_ID }}
          WRITE: ${{ steps.mode.outputs.write }}
          LIMIT: ${{ steps.mode.outputs.limit }}
          REPLY: ${{ steps.mode.outputs.reply }}
          FIX_LIST: ${{ steps.mode.outputs.fix_list }}
          DISCORD_FIX_CHANNEL_ID: ${{ vars.DISCORD_FIX_CHANNEL_ID }}
        run: |
          args=()
          if [ "${WRITE}" != "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${LIMIT}" ]; then
            args+=(--limit "${LIMIT}")
          fi
          if [ "${REPLY}" = "true" ]; then
            args+=(--reply)
          fi
          if [ "${FIX_LIST}" = "true" ]; then
            args+=(--fix-list)
          fi
          set +e
          python packages/server/discord_records_import.py "${args[@]}"
          rc=$?
          set -e
          # Exit codes 2/3/4/5 already printed a specific ::error:: (config / Google access / sheet data / Discord).
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ] && [ "${rc}" -ne 3 ] && [ "${rc}" -ne 4 ] && [ "${rc}" -ne 5 ]; then
            echo "::error title=Discord import crashed::discord_records_import.py exited with ${rc}; see the traceback above. Nothing was written unless the summary says so."
          fi
          exit "${rc}"

      - name: Remove the service-account key file
        if: always()
        run: |
          if [ -n "${AVALON_STATS_CREDENTIALS_FILE:-}" ]; then
            rm -f -- "${AVALON_STATS_CREDENTIALS_FILE}"
          fi
          rm -f -- "${RUNNER_TEMP}"/avalon-import-sa.*
