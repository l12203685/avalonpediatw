name: Test & Lint

on:
  push:
    branches: [main, develop, 'claude/**', 'gpt/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'avalon-game-records/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'avalon-game-records/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package first
        run: pnpm --filter @avalon/shared build

      - name: Run type checking
        run: pnpm type-check

      - name: Run linting
        run: pnpm lint

      # 複合篩選須與 Python 逐欄一致。含名字的快照答案只寫入暫存目錄，結束即刪除。
      - name: Set up Python 3.11 (the generator's version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generator unit tests
        run: |
          python packages/server/test_generate_cache.py
          python packages/server/test_discord_records_import.py

      - name: Stats engine parity references from the 牌譜 snapshot
        run: |
          python packages/server/scripts/build_stats_parity_fixtures.py --source snapshot --out "${RUNNER_TEMP}/stats-parity"
          python packages/server/scripts/build_mission_parity_fixture.py --source snapshot --out "${RUNNER_TEMP}/stats-parity"
          python packages/server/scripts/build_lake_parity_fixture.py --source snapshot --out "${RUNNER_TEMP}/stats-parity"
          echo "AVALON_STATS_PARITY_DIR=${RUNNER_TEMP}/stats-parity" >> "$GITHUB_ENV"

      - name: Run tests
        run: pnpm --filter @avalon/server test

      - name: Remove private parity references
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/stats-parity"

      - name: Build all packages
        run: pnpm build
        env:
          VITE_SERVER_URL: http://localhost:3001
          VITE_FIREBASE_API_KEY: test
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-bucket
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456'
          VITE_FIREBASE_APP_ID: test-app-id

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package first
        run: pnpm --filter @avalon/shared build

      - name: Check code quality
        run: |
          pnpm type-check
          pnpm lint
          echo "✅ Type checking passed"
          echo "✅ Lint checks passed"
