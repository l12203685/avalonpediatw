name: Refresh analysis cache

# 每天從 Google 試算表重算 packages/server/analysis_cache.json（戰績分析頁與 bots 讀這份），
# 有變動才 commit 到 main；Render 因 packages/server/** 變動而自動重新部署（會重開 server）。
#
# 金鑰：repo secret AVALON_STATS_SHEETS_CREDENTIALS_JSON = Google 服務帳號 JSON 金鑰檔全文；
#       沒設就退用 GOOGLE_SHEETS_CREDENTIALS_JSON；兩個都沒設 → 印 notice 後略過（不算失敗）。
#       試算表必須「共用」給金鑰裡的 client_email（檢視者即可）。
# 玩家資料（players / playerDetails）由「牌譜」分頁的 玩1..玩0 欄逐局彙整，不再讀「生涯報表」。
# 局的來源：「牌譜」+「Discord匯入」分頁（若存在；import-discord-records.yml 每天 03:17 從 Discord
#   論壇追加，貼文改過時改寫那一列並寫「更新時間」），同一局（同指紋）兩邊都有時只算「牌譜」那筆。
# 預覽：寫入前先跑 generate_cache.py --compare（不寫檔），把與現有快取的差異（玩家數、局數、
#       局數前 10 名的局數/勝率、多數玩家都變動的欄位、守門結果）寫進 job summary，供稽核。
#       這裡是公開紀錄：只寫數量，不寫玩家名字（本機執行才列名字）。
# 守門（generate_cache.py）：總局數變少、任一既有玩家的局數變少（牌譜只會往下加局；「Discord匯入」
#       自上次快取後因貼文修改而改寫的列〔「更新時間」〕能解釋的減少除外，例如改正打錯的玩家 id）、
#       玩家數比現有快取少超過 max(5, 1%)、默契矩陣變空、玩家資料欄位遺失、內容空白或格式錯
#       → 拒絕覆寫並讓本 job 失敗（exit 4），現有快取不動。
#       手動執行時可勾 allow_shrink 放寬「變少」檢查；「欄位遺失」檢查在這裡無法關閉。
# 每局資料集（複合篩選，Edward 2026-10-14）：同一次執行另寫 packages/server/games_cache.json（只有解析後的
#       結構化欄位，沒有文字記錄 / note 原文），與快取「同寫或同不寫」、一起 commit；快取的 overview.gamesKey
#       = 資料集的 key，網站與伺服器靠它確認兩檔同一批。資料集自己的檢查（round-trip、隱私形狀）沒過時只寫快取、
#       不寫資料集（網站篩選暫停），快取照常推送，最後一步讓 job 亮紅燈。公開紀錄一樣只有數量。
# 牌譜紀錄清單（網站「牌譜紀錄」頁籤）：同一次執行另跑 discord_records_export.py，用 DISCORD_BOT_TOKEN（同
#       import-discord-records.yml 的 secret）讀 Discord 論壇 #牌譜紀錄與覆盤 每篇貼文的起始訊息（不讀討論串
#       裡的回覆），寫 packages/server/records_cache.json（只有標題、標籤、發文時間與解析後的牌譜；不存起始訊息
#       原文；略過模擬與非牌譜貼文），跟快取一起 commit。沒設 token → notice 略過；讀取或檢查失敗 → 保留舊檔、
#       快取照常推送，最後一步讓 job 亮紅燈。allow_shrink 也放寬清單篇數變少的檢查。公開紀錄只有數量。
#       每篇讀得懂的牌譜另附陣容強度（S、每個座位的時點 PR，從同一次寫出的 games_cache.json 算）與可證明的失誤
#       標籤（Edward 2026-10-31）；沒有 token 或讀 Discord 失敗時用 --annotate-only 只更新這兩項。

on:
  schedule:
    - cron: '47 19 * * *'   # 每天 03:47 台灣時間（UTC+8）；GitHub 排程偶爾會延遲
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: '允許總局數或某玩家的局數變少、玩家比現有快取少超過 1%、或默契矩陣變空（例如刻意刪除重複局、改正玩家名字）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-analysis-cache
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: Refresh analysis_cache.json from the Sheet
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CACHE_PATH: packages/server/analysis_cache.json
      GAMES_PATH: packages/server/games_cache.json
      RECORDS_PATH: packages/server/records_cache.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Pick the credentials secret
        id: creds
        env:
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          if [ -n "${PRIMARY_JSON}" ]; then
            echo "secret=AVALON_STATS_SHEETS_CREDENTIALS_JSON" >> "$GITHUB_OUTPUT"
          elif [ -n "${FALLBACK_JSON}" ]; then
            echo "secret=GOOGLE_SHEETS_CREDENTIALS_JSON" >> "$GITHUB_OUTPUT"
          else
            msg="Skipped, nothing fetched or verified: add the repository secret AVALON_STATS_SHEETS_CREDENTIALS_JSON (the full JSON key of a Google service account that the stats sheet is shared with)."
            echo "::notice title=Analysis cache refresh skipped::${msg}"
            { echo "### 戰績分析快取：略過（未設定金鑰）"; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "secret=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.creds.outputs.secret != ''
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: steps.creds.outputs.secret != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/server/requirements-stats.txt

      - name: Install pinned dependencies
        if: steps.creds.outputs.secret != ''
        run: python -m pip install --disable-pip-version-check -r packages/server/requirements-stats.txt

      - name: Offline unit tests of the generator
        if: steps.creds.outputs.secret != ''
        run: |
          python packages/server/test_generate_cache.py
          python packages/server/test_discord_records_import.py
          python packages/server/test_discord_records_export.py

      - name: Write the service-account key to a temp file
        if: steps.creds.outputs.secret != ''
        env:
          SECRET_NAME: ${{ steps.creds.outputs.secret }}
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP}/avalon-stats-sa.XXXXXX")"
          echo "AVALON_STATS_CREDENTIALS_FILE=${key_file}" >> "$GITHUB_ENV"
          if [ "${SECRET_NAME}" = "AVALON_STATS_SHEETS_CREDENTIALS_JSON" ]; then
            printf '%s' "${PRIMARY_JSON}" > "${key_file}"
          else
            printf '%s' "${FALLBACK_JSON}" > "${key_file}"
          fi
          # 檢查必要欄位；公開日誌只印計數。
          python - "${key_file}" "${SECRET_NAME}" <<'PY'
          import json, sys
          path, secret = sys.argv[1], sys.argv[2]
          try:
              with open(path, encoding="utf-8-sig") as f:
                  info = json.load(f)
          except ValueError:
              info = None
          if not isinstance(info, dict) or not info.get("client_email") or not info.get("private_key"):
              print(f"::error title=Credentials secret malformed::Secret {secret} is not a Google "
                    "service-account JSON key (needs client_email and private_key). Paste the whole "
                    "downloaded key file content.")
              sys.exit(1)
          print("認證設定通過：1")
          PY

      - name: Preview the refresh (dry run, diff vs the committed cache)
        if: steps.creds.outputs.secret != ''
        env:
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '' }}
          AVALON_STATS_SHEET_ID: ${{ vars.AVALON_STATS_SHEET_ID }}
        run: |
          # Builds and checks the new cache exactly like the next step, appends what would change
          # to the job summary and writes nothing. If the guards would refuse, it exits 4 here.
          args=(--compare)
          if [ "${ALLOW_SHRINK}" = "1" ]; then
            args+=(--allow-shrink)
          fi
          set +e
          python packages/server/generate_cache.py "${args[@]}"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ] && [ "${rc}" -ne 3 ] && [ "${rc}" -ne 4 ]; then
            echo "::error title=Analysis cache preview crashed::generate_cache.py --compare exited with ${rc}; see the traceback above. Nothing was written."
          fi
          exit "${rc}"

      - name: Regenerate analysis_cache.json (and games_cache.json) from the Sheet
        id: regen
        if: steps.creds.outputs.secret != ''
        env:
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '' }}
          AVALON_STATS_SHEET_ID: ${{ vars.AVALON_STATS_SHEET_ID }}
        run: |
          args=()
          if [ "${ALLOW_SHRINK}" = "1" ]; then
            args+=(--allow-shrink)
            echo "::warning title=allow_shrink is on::The games/players/chemistry shrink guard is off for this run."
          fi
          set +e
          python packages/server/generate_cache.py "${args[@]}"
          rc=$?
          set -e
          # Exit codes 2/3/4 already printed a specific ::error:: (credentials / Google access / data guard).
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ] && [ "${rc}" -ne 3 ] && [ "${rc}" -ne 4 ]; then
            echo "::error title=Analysis cache refresh crashed::generate_cache.py exited with ${rc}; see the traceback above. Nothing was committed."
          fi
          exit "${rc}"

      - name: Export the Discord 牌譜 forum for the site's 牌譜紀錄 tab (records_cache.json)
        id: records
        if: steps.creds.outputs.secret != ''
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '' }}
        run: |
          # Read-only: the forum's post list and each post's starter message (never the replies in a
          # thread). A failure keeps the committed records_cache.json (the write is atomic) and does not
          # hold back the analysis cache; the last step turns the job red. Counts only in the log.
          # Without the token (or when the read fails) the committed list still gets today's 陣容強度 and
          # 失誤標籤 from the games_cache.json written above (--annotate-only reads no Discord).
          annotate() {
            python packages/server/discord_records_export.py --output "${RECORDS_PATH}" --annotate-only || \
              echo "::warning title=Records annotations not refreshed::discord_records_export.py --annotate-only failed; the list keeps its previous 陣容強度 / 失誤標籤."
          }
          if [ -z "${DISCORD_BOT_TOKEN}" ]; then
            msg="Skipped: add the repository secret DISCORD_BOT_TOKEN to keep the site's 牌譜紀錄 tab up to date."
            echo "::notice title=Records list skipped::${msg}"
            echo "- 牌譜紀錄清單：略過（未設定 DISCORD_BOT_TOKEN）" >> "$GITHUB_STEP_SUMMARY"
            echo "records=skipped" >> "$GITHUB_OUTPUT"
            annotate
            exit 0
          fi
          args=(--output "${RECORDS_PATH}")
          if [ "${ALLOW_SHRINK}" = "1" ]; then
            args+=(--allow-shrink)
          fi
          set +e
          python packages/server/discord_records_export.py "${args[@]}"
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "records=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exit codes 2/4/5 already printed a specific ::error:: (token / shape or shrink guard / Discord).
          if [ "${rc}" -ne 2 ] && [ "${rc}" -ne 4 ] && [ "${rc}" -ne 5 ]; then
            echo "::error title=Records list export crashed::discord_records_export.py exited with ${rc}; see the traceback above. The committed list is kept."
          fi
          echo "records=failed" >> "$GITHUB_OUTPUT"
          annotate

      - name: Commit and push if the cache changed
        if: steps.creds.outputs.secret != ''
        env:
          GAMES_DATASET: ${{ steps.regen.outputs.games_dataset }}
        run: |
          # 首次產生的資料集／牌譜紀錄清單尚未追蹤，須以 git status 判斷有無變動。
          if [ -z "$(git status --porcelain -- "${CACHE_PATH}" "${GAMES_PATH}" "${RECORDS_PATH}")" ]; then
            echo "analysis_cache.json, games_cache.json and records_cache.json are unchanged; nothing to commit."
            echo "- 結果：快取無變動，未 commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count() { python -c 'import json, sys; print(json.load(sys.stdin)["overview"][sys.argv[1]])' "$1"; }
          games="$(count totalGames < "${CACHE_PATH}")"
          players="$(count totalPlayers < "${CACHE_PATH}")"
          prev_games="$(git show "HEAD:${CACHE_PATH}" | count totalGames)"
          prev_players="$(git show "HEAD:${CACHE_PATH}" | count totalPlayers)"
          if [ "${GAMES_DATASET}" = "withheld" ]; then
            dataset_note="每局資料集暫停寫入（網站篩選暫停）"
          elif [ -n "$(git status --porcelain -- "${GAMES_PATH}")" ] && [ -f "${GAMES_PATH}" ]; then
            dataset_games="$(python -c 'import json, sys; print(json.load(sys.stdin)["counts"]["games"])' < "${GAMES_PATH}")"
            dataset_note="每局資料集 ${dataset_games} 局"
          else
            dataset_note="每局資料集無變動"
          fi
          records_note=""
          if [ -n "$(git status --porcelain -- "${RECORDS_PATH}")" ] && [ -f "${RECORDS_PATH}" ]; then
            records_posts="$(python -c 'import json, sys; print(json.load(sys.stdin)["counts"]["posts"])' < "${RECORDS_PATH}")"
            records_note="；牌譜紀錄清單 ${records_posts} 篇"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${CACHE_PATH}"
          if [ -f "${GAMES_PATH}" ]; then
            git add -- "${GAMES_PATH}"
          fi
          if [ -f "${RECORDS_PATH}" ]; then
            git add -- "${RECORDS_PATH}"
          fi
          git commit -q -m "chore(stats): 每日更新戰績分析快取（${games} 局）" \
            -m "局數 ${prev_games} → ${games}，玩家 ${prev_players} → ${players}；${dataset_note}${records_note}。由 refresh-analysis-cache workflow 從 Google 試算表重算；archetype、playstyle、featureStudies 沿用前次快取。"

          for attempt in 1 2 3; do
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort || true
              echo "::error title=Analysis cache not pushed::analysis_cache.json changed on main during this run; not overwriting it. The next run rebuilds on top of the new version."
              exit 1
            fi
            if git push -q origin HEAD:main; then
              echo "Pushed analysis_cache.json: ${prev_games} → ${games} games."
              echo "- 結果：已推送到 main（${prev_games} → ${games} 局）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing and retrying..."
            sleep $((attempt * 5))
          done
          echo "::error title=Analysis cache not pushed::git push to main was rejected 3 times (branch protection or concurrent pushes)."
          exit 1

      - name: Fail when the games dataset was withheld
        # 分析快取照常推送；若資料集被停寫，最後讓工作失敗並提示檢查原因。
        if: steps.creds.outputs.secret != '' && steps.regen.outputs.games_dataset == 'withheld'
        run: |
          echo "::error title=Games dataset withheld::games_cache.json was not updated (see the annotation of the regenerate step); the site's filters stay off until both files match again."
          echo "- 每局資料集：暫停寫入（網站篩選暫停），請看 regenerate 步驟的錯誤說明" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail when the records list could not be exported
        # 快取照常推送；牌譜紀錄清單讀取或檢查失敗時保留舊檔，最後讓工作失敗並提示原因。
        if: steps.creds.outputs.secret != '' && steps.records.outputs.records == 'failed'
        run: |
          echo "::error title=Records list not updated::records_cache.json was not updated (see the annotation of the export step); the site's 牌譜紀錄 tab shows the previous list."
          echo "- 牌譜紀錄清單：未更新（網站沿用前一版），請看 export 步驟的錯誤說明" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remove the service-account key file
        if: always()
        run: |
          if [ -n "${AVALON_STATS_CREDENTIALS_FILE:-}" ]; then
            rm -f -- "${AVALON_STATS_CREDENTIALS_FILE}"
          fi
          rm -f -- "${RUNNER_TEMP}"/avalon-stats-sa.*
