name: Refresh analysis cache

# 每天從 Google 試算表重算 packages/server/analysis_cache.json（戰績分析頁與 bots 讀這份），
# 有變動才 commit 到 main；Render 因 packages/server/** 變動而自動重新部署（會重開 server）。
#
# 金鑰：repo secret AVALON_STATS_SHEETS_CREDENTIALS_JSON = Google 服務帳號 JSON 金鑰檔全文；
#       沒設就退用 GOOGLE_SHEETS_CREDENTIALS_JSON；兩個都沒設 → 印 notice 後略過（不算失敗）。
#       試算表必須「共用」給金鑰裡的 client_email（檢視者即可）。
# 玩家資料（players / playerDetails）由「牌譜」分頁的 玩1..玩0 欄逐局彙整，不再讀「生涯報表」。
# 局的來源：「牌譜」+「Discord匯入」分頁（若存在；import-discord-records.yml 每天 03:17 從 Discord
#   論壇追加），同一局（同指紋）兩邊都有時只算「牌譜」那筆。
# 預覽：寫入前先跑 generate_cache.py --compare（不寫檔），把與現有快取的差異（玩家數、局數、
#       局數前 10 名的局數/勝率、多數玩家都變動的欄位、守門結果）寫進 job summary，供稽核。
# 守門（generate_cache.py）：總局數變少、任一既有玩家的局數變少（牌譜只會往下加局）、
#       玩家數比現有快取少超過 max(5, 1%)、默契矩陣變空、玩家資料欄位遺失、內容空白或格式錯
#       → 拒絕覆寫並讓本 job 失敗（exit 4），現有快取不動。
#       手動執行時可勾 allow_shrink 放寬「變少」檢查；「欄位遺失」檢查在這裡無法關閉。

on:
  schedule:
    - cron: '47 19 * * *'   # 每天 03:47 台灣時間（UTC+8）；GitHub 排程偶爾會延遲
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: '允許總局數或某玩家的局數變少、玩家比現有快取少超過 1%、或默契矩陣變空（例如刻意刪除重複局、改正玩家名字）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-analysis-cache
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    name: Refresh analysis_cache.json from the Sheet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CACHE_PATH: packages/server/analysis_cache.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Pick the credentials secret
        id: creds
        env:
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          if [ -n "${PRIMARY_JSON}" ]; then
            echo "secret=AVALON_STATS_SHEETS_CREDENTIALS_JSON" >> "$GITHUB_OUTPUT"
          elif [ -n "${FALLBACK_JSON}" ]; then
            echo "secret=GOOGLE_SHEETS_CREDENTIALS_JSON" >> "$GITHUB_OUTPUT"
          else
            msg="Skipped, nothing fetched or verified: add the repository secret AVALON_STATS_SHEETS_CREDENTIALS_JSON (the full JSON key of a Google service account that the stats sheet is shared with)."
            echo "::notice title=Analysis cache refresh skipped::${msg}"
            { echo "### 戰績分析快取：略過（未設定金鑰）"; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"
            echo "secret=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.creds.outputs.secret != ''
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        if: steps.creds.outputs.secret != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/server/requirements-stats.txt

      - name: Install pinned dependencies
        if: steps.creds.outputs.secret != ''
        run: python -m pip install --disable-pip-version-check -r packages/server/requirements-stats.txt

      - name: Offline unit tests of the generator
        if: steps.creds.outputs.secret != ''
        run: |
          python packages/server/test_generate_cache.py
          python packages/server/test_discord_records_import.py

      - name: Write the service-account key to a temp file
        if: steps.creds.outputs.secret != ''
        env:
          SECRET_NAME: ${{ steps.creds.outputs.secret }}
          PRIMARY_JSON: ${{ secrets.AVALON_STATS_SHEETS_CREDENTIALS_JSON }}
          FALLBACK_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP}/avalon-stats-sa.XXXXXX")"
          echo "AVALON_STATS_CREDENTIALS_FILE=${key_file}" >> "$GITHUB_ENV"
          if [ "${SECRET_NAME}" = "AVALON_STATS_SHEETS_CREDENTIALS_JSON" ]; then
            printf '%s' "${PRIMARY_JSON}" > "${key_file}"
          else
            printf '%s' "${FALLBACK_JSON}" > "${key_file}"
          fi
          # Validate the shape and print only client_email (not secret) -- never the key itself.
          python - "${key_file}" "${SECRET_NAME}" <<'PY'
          import json, sys
          path, secret = sys.argv[1], sys.argv[2]
          try:
              with open(path, encoding="utf-8-sig") as f:
                  info = json.load(f)
          except ValueError:
              info = None
          if not isinstance(info, dict) or not info.get("client_email") or not info.get("private_key"):
              print(f"::error title=Credentials secret malformed::Secret {secret} is not a Google "
                    "service-account JSON key (needs client_email and private_key). Paste the whole "
                    "downloaded key file content.")
              sys.exit(1)
          print(f"Using service account {info['client_email']} (from secret {secret}).")
          PY

      - name: Preview the refresh (dry run, diff vs the committed cache)
        if: steps.creds.outputs.secret != ''
        env:
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '' }}
          AVALON_STATS_SHEET_ID: ${{ vars.AVALON_STATS_SHEET_ID }}
        run: |
          # Builds and checks the new cache exactly like the next step, appends what would change
          # to the job summary and writes nothing. If the guards would refuse, it exits 4 here.
          args=(--compare)
          if [ "${ALLOW_SHRINK}" = "1" ]; then
            args+=(--allow-shrink)
          fi
          set +e
          python packages/server/generate_cache.py "${args[@]}"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ] && [ "${rc}" -ne 3 ] && [ "${rc}" -ne 4 ]; then
            echo "::error title=Analysis cache preview crashed::generate_cache.py --compare exited with ${rc}; see the traceback above. Nothing was written."
          fi
          exit "${rc}"

      - name: Regenerate analysis_cache.json from the Sheet
        if: steps.creds.outputs.secret != ''
        env:
          ALLOW_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '' }}
          AVALON_STATS_SHEET_ID: ${{ vars.AVALON_STATS_SHEET_ID }}
        run: |
          args=()
          if [ "${ALLOW_SHRINK}" = "1" ]; then
            args+=(--allow-shrink)
            echo "::warning title=allow_shrink is on::The games/players/chemistry shrink guard is off for this run."
          fi
          set +e
          python packages/server/generate_cache.py "${args[@]}"
          rc=$?
          set -e
          # Exit codes 2/3/4 already printed a specific ::error:: (credentials / Google access / data guard).
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ] && [ "${rc}" -ne 3 ] && [ "${rc}" -ne 4 ]; then
            echo "::error title=Analysis cache refresh crashed::generate_cache.py exited with ${rc}; see the traceback above. Nothing was committed."
          fi
          exit "${rc}"

      - name: Commit and push if the cache changed
        if: steps.creds.outputs.secret != ''
        run: |
          if git diff --quiet -- "${CACHE_PATH}"; then
            echo "analysis_cache.json is unchanged; nothing to commit."
            echo "- 結果：快取無變動，未 commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count() { python -c 'import json, sys; print(json.load(sys.stdin)["overview"][sys.argv[1]])' "$1"; }
          games="$(count totalGames < "${CACHE_PATH}")"
          players="$(count totalPlayers < "${CACHE_PATH}")"
          prev_games="$(git show "HEAD:${CACHE_PATH}" | count totalGames)"
          prev_players="$(git show "HEAD:${CACHE_PATH}" | count totalPlayers)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${CACHE_PATH}"
          git commit -q -m "chore(stats): 每日更新戰績分析快取（${games} 局）" \
            -m "局數 ${prev_games} → ${games}，玩家 ${prev_players} → ${players}。由 refresh-analysis-cache workflow 從 Google 試算表重算；archetype、playstyle、featureStudies 沿用前次快取。"

          for attempt in 1 2 3; do
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort || true
              echo "::error title=Analysis cache not pushed::analysis_cache.json changed on main during this run; not overwriting it. The next run rebuilds on top of the new version."
              exit 1
            fi
            if git push -q origin HEAD:main; then
              echo "Pushed analysis_cache.json: ${prev_games} → ${games} games."
              echo "- 結果：已推送到 main（${prev_games} → ${games} 局）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing and retrying..."
            sleep $((attempt * 5))
          done
          echo "::error title=Analysis cache not pushed::git push to main was rejected 3 times (branch protection or concurrent pushes)."
          exit 1

      - name: Remove the service-account key file
        if: always()
        run: |
          if [ -n "${AVALON_STATS_CREDENTIALS_FILE:-}" ]; then
            rm -f -- "${AVALON_STATS_CREDENTIALS_FILE}"
          fi
          rm -f -- "${RUNNER_TEMP}"/avalon-stats-sa.*
