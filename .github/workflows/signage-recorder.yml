name: Signage recorder
# 遊玩頁（avalon.signage-cloud.org）對局記錄員——Edward 2026-10-31：「免費 B 應該更好」「一開始只需要注意晚上 1900~2400」。
#
# 每晚 18:40（台灣時間）開始，以「阿瓦隆百科」暱稱旁觀所有房間（只讀畫面資料，不按任何按鈕），到 00:15 結束。
# 每打完一局，就用機器人（DISCORD_BOT_TOKEN）在 DC 牌譜頻道開一篇討論串：牌譜、六碼、刺殺、座位暱稱，附「開牌後配置」
# 與「視覺化牌譜」兩張截圖，最後一行「（機器人紀錄員尚待檢視）」。真人 10 人完整局掛結果標籤（三紅／三藍被刀／三藍躲刺）＋線瓦，
# 凌晨的 import-discord-records.yml 再把這些貼文收進戰績；其他局（Edward 11/03：都先貼，錯的或沒意義的他會刪）標題加
# 「【待檢視】」、不掛結果標籤，匯入會略過，人工檢視後把標題的【待檢視】拿掉才收錄。
# 有百科機器人（暱稱「百科機器人」開頭，signage-player.yml）坐在桌上的局：一律【待檢視】＋「模擬」標籤、內文寫它坐哪一家，
# 不當真人紀錄匯入；百科機器人自己的私房測試（標題「百科機器人測試」開頭）不旁觀。
# 程式：packages/server/scripts/signageRecorder.ts、signagePaipu.ts。
#
# 公開 repo：log 只有時間、房號、檔名與狀態碼，不含玩家暱稱或牌譜內容。原始紀錄（含暱稱）不進 repo；
# 有設定 secret RECORDER_ARCHIVE_KEY 時，才加密成 artifact 保留 30 天（openssl aes-256-cbc -pbkdf2，用這把鑰匙解）。
on:
  schedule:
    # 18:40 台灣時間起每半小時一個觸發：GitHub 排程可能延後很久（10/31 第一晚 18:40 的觸發晚了 5 小時才跑），
    # 多排幾個，哪個先開始就跑到 00:15；concurrency 讓其餘的排隊，等前一個結束時已過 00:15 就直接結束。
    - cron: '40 10 * * *'
    - cron: '10 11 * * *'
    - cron: '40 11 * * *'
    - cron: '10 12 * * *'
    - cron: '40 12 * * *'
    - cron: '10 13 * * *'
    - cron: '40 13 * * *'
    - cron: '10 14 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '跑幾小時（最多 5.7；空白 = 跑到台灣時間 00:15）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: signage-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/server/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install recorder runtime
        run: |
          npm install -g tsx@4.19.2 playwright@1.49.1
          npx -y playwright@1.49.1 install --with-deps chromium
      - name: Record
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HOURS_INPUT: ${{ inputs.hours }}
        run: |
          export NODE_PATH="$(npm root -g)"
          if [ -n "$HOURS_INPUT" ]; then
            HOURS="$HOURS_INPUT"
          else
            # 跑到台灣時間 00:15（UTC 16:15）；排程延後到 00:15 以後（或台灣 18:00 以前）就不跑
            HOURS=$(python3 -c "import datetime as d;n=d.datetime.utcnow();e=n.replace(hour=16,minute=15,second=0,microsecond=0);print(0 if (n>=e or n.hour<10) else round(min((e-n).total_seconds()/3600,5.7),2))")
          fi
          if python3 -c "import sys; sys.exit(0 if float('$HOURS') < 0.1 else 1)"; then echo "已過 00:15 或前一個排程已跑完這一晚，略過"; exit 0; fi
          echo "跑 $HOURS 小時"
          [ -n "$DISCORD_BOT_TOKEN" ] || echo "::warning::沒有 DISCORD_BOT_TOKEN，只記錄不貼 DC"
          mkdir -p records
          tsx packages/server/scripts/signageRecorder.ts --out records --hours "$HOURS"
          echo "存了 $(ls records | grep '\.json$' | grep -vc incomplete) 局（另有 $(ls records | grep -c 'incomplete\.json$') 個未完成檔、$(ls records | grep -c '\.jpg$') 張截圖）" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt raw records
        if: always()
        env:
          KEY: ${{ secrets.RECORDER_ARCHIVE_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$(ls records 2>/dev/null)" ]; then echo "不保留原始紀錄"; exit 0; fi
          tar czf - records | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -out records.tgz.enc
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('records.tgz.enc') != ''
        with:
          name: signage-records-${{ github.run_id }}
          path: records.tgz.enc
          retention-days: 30
