# Read-only look at the Discord channel where game records (牌譜) are posted,
# to plan importing them into the Google Sheet. Uses the existing GitHub secret
# DISCORD_BOT_TOKEN (never printed). Prints counts/format stats and only a few
# truncated samples; this repo is public, so delete the run's logs after reading.
name: Probe Discord records

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Discord channel id'
        required: false
        default: '1132683080134578276'
      samples:
        description: 'How many record-like messages to print (truncated)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect channel history
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ inputs.channel_id }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          python3 - <<'PY'
          import collections, json, os, re, sys, time, urllib.error, urllib.parse, urllib.request
          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          if not token:
              print("::notice::GitHub secret DISCORD_BOT_TOKEN is not set"); sys.exit(0)
          cid = os.environ["CHANNEL_ID"]; samples = int(os.environ.get("SAMPLES") or 3)
          def api(path, soft=False):
              req = urllib.request.Request("https://discord.com/api/v10" + path, headers={
                  "Authorization": f"Bot {token}", "User-Agent": "DiscordBot (avalonpediatw, 1.0)"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          time.sleep(float(json.loads(e.read() or b"{}").get("retry_after", 2)) + 0.5); continue
                      if soft: return None
                      print(f"::error::GET {path} -> HTTP {e.code}: {e.read()[:200].decode(errors='replace')}"); sys.exit(1)
          me = api("/users/@me")
          print(f"bot: {me.get('username')} id={me.get('id')}")
          ch = api(f"/channels/{cid}")
          print(f"channel: #{ch.get('name')} type={ch.get('type')} guild={ch.get('guild_id')} topic={(ch.get('topic') or '')[:120]!r}")
          tags = {t["id"]: t["name"] for t in ch.get("available_tags", [])}
          if tags: print("forum tags:", list(tags.values()))
          threads = list(api(f"/guilds/{ch['guild_id']}/threads/active").get("threads", []))
          threads = [t for t in threads if t.get("parent_id") == cid]
          before = None
          while True:
              q = f"/channels/{cid}/threads/archived/public?limit=100" + (f"&before={urllib.parse.quote(before)}" if before else "")
              page = api(q)
              threads += page.get("threads", [])
              if not page.get("has_more") or not page.get("threads"): break
              before = page["threads"][-1]["thread_metadata"]["archive_timestamp"]
          seen = {}
          for t in threads: seen[t["id"]] = t
          threads = sorted(seen.values(), key=lambda t: int(t["id"]))
          print(f"posts (threads): {len(threads)}")
          if not threads: sys.exit(0)
          def created(t):  # snowflake -> ISO date
              ms = (int(t["id"]) >> 22) + 1420070400000
              return time.strftime("%Y-%m-%d", time.gmtime(ms / 1000))
          months = collections.Counter(created(t)[:7] for t in threads)
          print("posts per month:", dict(sorted(months.items())))
          print(f"range: {created(threads[0])} .. {created(threads[-1])}")
          print("tag use:", dict(collections.Counter(tags.get(x, x) for t in threads for x in t.get("applied_tags", []))))
          done_id = next((k for k, v in tags.items() if v == "已收錄"), None)
          todo = [t for t in threads if done_id not in t.get("applied_tags", [])]
          print(f"posts without 已收錄: {len(todo)}; per month:", dict(sorted(collections.Counter(created(t)[:7] for t in todo).items())))
          print("reply count (message_count) median:", sorted(t.get("message_count", 0) for t in threads)[len(threads)//2])
          print("sample titles:", [t.get("name", "")[:40] for t in threads[-15:]])
          rec = re.compile(r"(?m)^\s*[0-9]{2,5}(?:\s+[0-9]+[+-])*\s*$")
          mission = re.compile(r"(?m)^\s*[ox]{2,5}\s*$")
          picks = threads[:1] + threads[-samples:]
          stats = collections.Counter()
          for t in threads[-60:]:
              m = api(f"/channels/{t['id']}/messages/{t['id']}", soft=True)
              body = (m or {}).get("content", "")
              stats["checked"] += 1
              stats["empty"] += not body
              stats["record-like"] += len(rec.findall(body)) >= 3 and bool(mission.search(body))
              stats["attachments"] += len((m or {}).get("attachments", []))
              time.sleep(0.25)
          print("last-60 starter messages:", dict(stats))
          for t in picks:
              m = api(f"/channels/{t['id']}/messages/{t['id']}", soft=True) or {}
              body = m.get("content", "")
              print(f"\n--- post {created(t)} title={t.get('name','')[:40]!r} by {m.get('author',{}).get('username')} ({len(body)} chars, {len(m.get('attachments', []))} attachments)")
              print(body[:700])
          PY
