name: Game records exports

on:
  push:
    branches: [main]
    paths:
      - 'avalon-game-records/games/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: game-records-exports
  cancel-in-progress: false

defaults:
  run:
    working-directory: avalon-game-records

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: avalon-game-records/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build CSV + STATS.md
        run: npm run build-exports

      - name: Commit exports back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/games.csv STATS.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate game records exports"
            git push origin main
          fi

      - name: Sync Google Sheets
        run: npm run sync-google-sheets
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}

      - name: Sync HackMD
        run: npm run sync-hackmd
        env:
          HACKMD_API_TOKEN: ${{ secrets.HACKMD_API_TOKEN }}
          HACKMD_NOTE_ID: ${{ secrets.HACKMD_NOTE_ID }}
