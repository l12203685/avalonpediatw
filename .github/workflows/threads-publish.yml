# Threads 每日自動發佈（站長 2026-11-17 同意自動發佈）。說明：docs/THREADS.md〈自動發佈〉。
#
# - 預設只試跑：repo 變數 THREADS_PUBLISH 是 '1' 才真的發文；試跑把要發的內容放在這次執行的摘要與附件。
# - 每小時醒一次，到了台北時間 THREADS_POST_HOUR（預設 12）點以後才做事；同一天發過就不再發。
# - 權杖只放 secrets（THREADS_ACCESS_TOKEN，選填 THREADS_USER_ID）；這個 repo 的執行紀錄是公開的，任何步驟都不印權杖。
# - 發文狀態與圖放在 threads-state 分支（state/<日期>.json、images/<日期>.png）；圖用 raw.githubusercontent.com 的公開網址給 Threads 抓。
# - Instagram 同步（選用）：有 secret INSTAGRAM_ACCESS_TOKEN 才會準備；repo 變數 INSTAGRAM_PUBLISH 是 '1' 才真的發。
#   IG 只收 JPEG、長寬比 4:5～1.91:1，所以圖先轉成 1080×1350 的 JPEG（images/<日期>.jpg）。
name: Threads 每日發文

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '日期 YYYY-MM-DD（台北；空白＝今天）'
        required: false
        default: ''
      mode:
        description: 'auto＝照 THREADS_PUBLISH；dry-run＝只試跑；record-manual＝補記手動發的那一天'
        type: choice
        options: [dry-run, auto, record-manual]
        default: dry-run
      post_id:
        description: 'record-manual 用：那一天手動發的貼文 id（空白＝用權杖去最近的貼文裡找）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      STATE_DIR: /tmp/threads-state
      OUT_DIR: /tmp/threads-out
    steps:
      - name: 決定日期與模式
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          IN_DATE: ${{ inputs.date }}
          IN_MODE: ${{ inputs.mode }}
          PUBLISH: ${{ vars.THREADS_PUBLISH }}
          POST_HOUR: ${{ vars.THREADS_POST_HOUR }}
          HAS_IG: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' }}
          IG_PUBLISH: ${{ vars.INSTAGRAM_PUBLISH }}
          LIVE_FROM: ${{ vars.THREADS_LIVE_FROM }}
        run: |
          set -euo pipefail
          DATE="${IN_DATE:-$(TZ=Asia/Taipei date +%F)}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "日期格式不對：$DATE"; exit 1; fi
          MODE="${IN_MODE:-auto}"
          if [ "$MODE" = auto ]; then
            if [ "${PUBLISH:-}" = 1 ]; then MODE=live; else MODE=dry-run; fi
          fi
          # Instagram：沒有權杖＝off；手動選 dry-run 或沒開 INSTAGRAM_PUBLISH＝只試跑；補記手動發的那天不碰 IG。
          IG=off
          if [ "${HAS_IG:-}" = true ] && [ "$MODE" != record-manual ]; then
            if [ "${IN_MODE:-auto}" != dry-run ] && [ "${IG_PUBLISH:-}" = 1 ]; then IG=live; else IG=dry-run; fi
          fi
          # 正式發的起始日（站長 11/17：圖、文字、小觀念確認前不要發）：沒設 THREADS_LIVE_FROM，或今天早於那天，排程一律只試跑。
          if [ "$EVENT" = schedule ] && { [ -z "${LIVE_FROM:-}" ] || [[ "$DATE" < "$LIVE_FROM" ]]; }; then
            if [ "$MODE" = live ]; then MODE=dry-run; fi
            if [ "$IG" = live ]; then IG=dry-run; fi
          fi
          RUN=1
          if [ "$EVENT" = schedule ]; then
            HOUR=$((10#$(TZ=Asia/Taipei date +%H)))
            WANT=$((10#${POST_HOUR:-12}))
            # 正式發：到點以後每小時都看一次（排程延遲也補得上），發過就跳過；試跑：只在那個整點跑一次。
            if [ "$HOUR" -lt "$WANT" ]; then RUN=0; fi
            if [ "$MODE" != live ] && [ "$IG" != live ] && [ "$HOUR" -ne "$WANT" ]; then RUN=0; fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "ig=$IG" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "日期 $DATE，模式 $MODE，IG $IG，執行 $RUN"

      - name: 取出 threads-state 分支
        if: steps.gate.outputs.run == '1'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.gate.outputs.date }}
          MODE: ${{ steps.gate.outputs.mode }}
          IG: ${{ steps.gate.outputs.ig }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" threads-state >/dev/null 2>&1; then
            git clone -q --depth 1 --branch threads-state "$URL" "$STATE_DIR"
          else
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init -q -b threads-state
            git -C "$STATE_DIR" remote add origin "$URL"
            printf '# threads-state\n\nThreads 每日自動發佈的狀態（state/<日期>.json）與題目圖（images/<日期>.png）。\n由 .github/workflows/threads-publish.yml 寫入；說明見 main 分支的 docs/THREADS.md。\n' > "$STATE_DIR/README.md"
          fi
          git -C "$STATE_DIR" config user.name 'github-actions[bot]'
          git -C "$STATE_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 要正式發的（Threads、IG）都已經發過才跳過。
          SKIP=0; TDONE=1; IDONE=1
          F="$STATE_DIR/state/$DATE.json"
          # Threads：發過才算完成；但這條管線發的 A 第一則留言沒成功（commentId 記成 null）時照跑，post 段只補發留言。
          if [ "$MODE" = live ]; then TDONE=0; [ -f "$F" ] && jq -e '.postId != null and ((.source == "auto" and has("commentId") and .commentId == null) | not)' "$F" >/dev/null && TDONE=1; fi
          if [ "$IG" = live ]; then IDONE=0; [ -f "$F" ] && jq -e '.ig.mediaId != null' "$F" >/dev/null && IDONE=1; fi
          if { [ "$MODE" = live ] || [ "$IG" = live ]; } && [ "$TDONE" = 1 ] && [ "$IDONE" = 1 ]; then SKIP=1; echo "$DATE 已經發過，跳過"; fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1'

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1'
        with:
          version: 8

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1'
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 安裝
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @avalon/shared build

      # 續期或寫回 secrets 失敗都不擋住後面的產生與發文（只出警告）。
      - name: 權杖快到期就續期（要 secrets.THREADS_SECRETS_PAT 才寫得回去）
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1' && steps.gate.outputs.mode == 'live'
        continue-on-error: true
        working-directory: packages/server
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SECRETS_PAT: ${{ secrets.THREADS_SECRETS_PAT }}
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/threads_new_token"
          if [ -n "${SECRETS_PAT:-}" ]; then
            npx tsx scripts/threadsPublish.ts token --token-out "$NEW" || echo "續期沒成功，照舊權杖發文"
          else
            npx tsx scripts/threadsPublish.ts token || true
          fi
          if [ -s "$NEW" ]; then
            echo "::add-mask::$(cat "$NEW")"
            if GH_TOKEN="$SECRETS_PAT" gh secret set THREADS_ACCESS_TOKEN --repo "$REPO" < "$NEW"; then
              echo "權杖已續期並寫回 secrets"
            else
              echo "::warning::Threads 權杖續期了但寫不回 secrets（THREADS_SECRETS_PAT 要有這個 repo 的 Secrets 讀寫權限）；這次照樣用新權杖發文"
            fi
            echo "THREADS_ACCESS_TOKEN=$(cat "$NEW")" >> "$GITHUB_ENV"
            rm -f "$NEW"
          fi

      # IG 續期或寫回 secrets 失敗都不擋住後面 Threads 的產生與發文（只出警告）。
      - name: IG 權杖續期（每週一；要 secrets.THREADS_SECRETS_PAT 才寫得回去）
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1' && steps.gate.outputs.ig == 'live'
        continue-on-error: true
        working-directory: packages/server
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SECRETS_PAT: ${{ secrets.THREADS_SECRETS_PAT }}
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/ig_new_token"
          [ -n "${SECRETS_PAT:-}" ] || exit 0
          npx tsx scripts/threadsPublish.ts token-ig --token-out "$NEW" || echo "IG 續期沒成功，照舊權杖發文"
          if [ -s "$NEW" ]; then
            echo "::add-mask::$(cat "$NEW")"
            if GH_TOKEN="$SECRETS_PAT" gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$REPO" < "$NEW"; then
              echo "IG 權杖已續期並寫回 secrets"
            else
              echo "::warning::IG 權杖續期了但寫不回 secrets（THREADS_SECRETS_PAT 要有這個 repo 的 Secrets 讀寫權限）；這次照樣用新權杖"
            fi
            echo "INSTAGRAM_ACCESS_TOKEN=$(cat "$NEW")" >> "$GITHUB_ENV"
            rm -f "$NEW"
          fi

      - name: 產生今天的貼文並檢查
        id: prepare
        if: steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1' && steps.gate.outputs.mode != 'record-manual'
        working-directory: packages/server
        env:
          THREADS_MODE: ${{ steps.gate.outputs.mode }}
          DATE: ${{ steps.gate.outputs.date }}
          IG_PREVIEW: ${{ steps.gate.outputs.ig != 'off' && '1' || '0' }}
        run: npx tsx scripts/threadsPublish.ts prepare --date "$DATE" --state-dir "$STATE_DIR" --out "$OUT_DIR"

      # 轉檔失敗不影響 Threads（continue-on-error）：IG 那邊只在這一步成功時才用 JPEG、才同步。
      - name: IG 用的圖：轉成 1080×1350 JPEG
        id: ig_jpeg
        if: steps.prepare.outcome == 'success' && steps.gate.outputs.ig != 'off'
        continue-on-error: true
        env:
          DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          # plan.json 的 images：題目卡、牌譜圖、答案卡（照發文順序）。
          for name in $(jq -r '.images[]' "$OUT_DIR/plan.json"); do
            f="$OUT_DIR/$name"
            convert "$f" -background '#f7f5f0' -flatten -resize 1080x1350 -gravity center -extent 1080x1350 -quality 92 "${f%.png}.jpg"
          done
          ls -l "$OUT_DIR"

      - name: IG 的圖沒轉成功：今天不同步 IG（Threads 照常）
        if: steps.ig_jpeg.outcome == 'failure'
        run: |
          echo "::warning::IG 用的 JPEG 沒轉成功，今天不同步 IG；Threads 照常發"
          rm -f "$OUT_DIR"/*.jpg

      # Threads 或 IG 任一邊試跑就上傳（例如 Threads 正式發、IG 只試跑時要看 JPEG 和 IG 說明）。
      # 內容檢查沒過時 plan.json 不含貼文和留言（rejectedPlan），附件裡也就沒有被擋下的內容。
      - name: 試跑：把要發的內容存成附件
        if: always() && steps.gate.outputs.run == '1' && (steps.gate.outputs.mode == 'dry-run' || steps.gate.outputs.ig == 'dry-run')
        uses: actions/upload-artifact@v4
        with:
          name: threads-dry-run-${{ steps.gate.outputs.date }}
          path: /tmp/threads-out
          if-no-files-found: ignore
          retention-days: 14

      - name: 正式發：把圖推上 threads-state，取得公開網址
        if: steps.prepare.outcome == 'success' && (steps.gate.outputs.mode == 'live' || steps.gate.outputs.ig == 'live')
        id: image
        env:
          DATE: ${{ steps.gate.outputs.date }}
          IG_JPEG_OK: ${{ steps.ig_jpeg.outcome == 'success' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR/images"
          # 照 plan.json 的 images 順序（題目卡、牌譜圖、答案卡）：兩張以上發成輪播。
          NAMES=$(jq -r '.images[]' "$OUT_DIR/plan.json")
          [ -n "$NAMES" ] || exit 0
          for name in $NAMES; do
            cp "$OUT_DIR/$name" "$STATE_DIR/images/"
            if [ "$IG_JPEG_OK" = 1 ] && [ -f "$OUT_DIR/${name%.png}.jpg" ]; then cp "$OUT_DIR/${name%.png}.jpg" "$STATE_DIR/images/"; fi
          done
          git -C "$STATE_DIR" add -A
          git -C "$STATE_DIR" commit -q -m "threads: $DATE 的題目圖" || true
          for d in 2 4 8 16 0; do git -C "$STATE_DIR" push -q origin threads-state && break; [ "$d" = 0 ] && exit 1; sleep "$d"; done
          SHA=$(git -C "$STATE_DIR" rev-parse HEAD)
          BASE="https://raw.githubusercontent.com/${REPO}/${SHA}/images"
          PNGS=""; JPGS=""
          for name in $NAMES; do
            PNGS="${PNGS:+$PNGS,}$BASE/$name"
            if [ "$IG_JPEG_OK" = 1 ] && [ -f "$OUT_DIR/${name%.png}.jpg" ]; then JPGS="${JPGS:+$JPGS,}$BASE/${name%.png}.jpg"; fi
          done
          echo "urls=$PNGS" >> "$GITHUB_OUTPUT"
          echo "ig_urls=$JPGS" >> "$GITHUB_OUTPUT"

      - name: 正式發：發 A（引用昨天）與第一則留言
        if: steps.image.outcome == 'success' && steps.gate.outputs.mode == 'live'
        working-directory: packages/server
        env:
          THREADS_ACCESS_TOKEN: ${{ env.THREADS_ACCESS_TOKEN || secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IMAGE_URLS: ${{ steps.image.outputs.urls }}
        # --checkpoint-push：發出 A、發出留言後馬上把狀態檔推上 threads-state（不等最後一步）。
        # 權杖查不到權限、失效或少權限時這一步直接失敗、不發文（fail closed）。
        run: npx tsx scripts/threadsPublish.ts post --state-dir "$STATE_DIR" --out "$OUT_DIR" --checkpoint-push

      - name: Instagram 同步
        if: always() && steps.prepare.outcome == 'success' && steps.ig_jpeg.outcome == 'success' && steps.image.outcome == 'success' && steps.gate.outputs.ig == 'live'
        working-directory: packages/server
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ env.INSTAGRAM_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_IMAGE_URLS: ${{ steps.image.outputs.ig_urls }}
        # 先確認 IG 權杖能發文，確認不了就跳過 IG（警告、不失敗）；發出去後馬上把狀態檔推上 threads-state。
        run: npx tsx scripts/threadsPublish.ts post-ig --state-dir "$STATE_DIR" --out "$OUT_DIR" --checkpoint-push

      - name: 補記手動發的那一天
        if: steps.gate.outputs.run == '1' && steps.gate.outputs.mode == 'record-manual'
        working-directory: packages/server
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          DATE: ${{ steps.gate.outputs.date }}
          POST_ID: ${{ inputs.post_id }}
        run: npx tsx scripts/threadsPublish.ts record-manual --date "$DATE" --state-dir "$STATE_DIR" ${POST_ID:+--post-id "$POST_ID"}

      - name: 記下發文狀態
        if: always() && steps.gate.outputs.run == '1' && steps.state.outputs.skip != '1' && (steps.gate.outputs.mode == 'live' || steps.gate.outputs.mode == 'record-manual' || steps.gate.outputs.ig == 'live')
        env:
          DATE: ${{ steps.gate.outputs.date }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          [ -d "$STATE_DIR/.git" ] || exit 0
          git -C "$STATE_DIR" add -A
          git -C "$STATE_DIR" commit -q -m "threads: $DATE（$MODE）" || echo "沒有新的變更"
          git -C "$STATE_DIR" rev-parse -q --verify HEAD >/dev/null || { echo "沒有要記的"; exit 0; }
          # 不管這一步有沒有新的 commit 都推：發文時的 checkpoint 可能 commit 了卻沒推成功。被拒就 fetch＋merge 再推。
          for d in 2 4 8 16 0; do
            git -C "$STATE_DIR" push -q origin HEAD:threads-state && break
            [ "$d" = 0 ] && exit 1
            sleep "$d"
            { git -C "$STATE_DIR" fetch -q origin threads-state && git -C "$STATE_DIR" merge -q --no-edit FETCH_HEAD; } || true
          done

      - name: 清掉暫存
        if: always()
        run: rm -rf "${{ runner.temp }}/threads_new_token" "${{ runner.temp }}/ig_new_token"
