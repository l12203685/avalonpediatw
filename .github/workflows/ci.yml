name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-ASSETS'
      - 'ASSET_CREDITS.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE-ASSETS'
      - 'ASSET_CREDITS.md'

jobs:
  build-and-test:
    name: Build, type-check, lint, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package first
        run: pnpm --filter @avalon/shared build

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Server tests
        run: pnpm --filter @avalon/server test

      - name: Build all packages
        run: pnpm build
        env:
          # Test-only placeholders so Vite builds don't fail.
          # Real deploys must supply real values via repo secrets.
          VITE_SERVER_URL: http://localhost:3001
          VITE_FIREBASE_API_KEY: test-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-bucket
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456'
          VITE_FIREBASE_APP_ID: test-app-id

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true
